<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self'; manifest-src 'self'">
  <meta name="theme-color" content="#f7f7fc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lucide">
  <meta name="description" content="Lucide Budget : revenus, dépenses et argent disponible. Sans compte ni fichier à importer.">
  <title>Lucide — Mon budget</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
:root{--bg:#f8f9fd;--text:#1b2440;--muted:#8790a3;--line:#eef0f6;--purple:#695cdb;--deep:#272a65;--shadow:0 8px 27px rgba(31,37,67,.045)}
*{box-sizing:border-box}html{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}body{margin:0;color:var(--text);background:var(--bg);font-size:15px;line-height:1.4}
button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b9b4ff;outline-offset:3px}
.app-wrapper{max-width:850px;margin:0 auto;padding:0 20px}.topbar{height:80px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:7px;font-size:24px;font-weight:900;letter-spacing:-1.2px}.brand-icon{height:37px;width:37px;border-radius:13px;background:#6e61e7;color:#fff;display:grid;place-items:center;font-size:23px;margin-right:4px}.brand-dot{color:#7768e9;margin-left:-6px}.privacy-label{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:#8491a0}.privacy-dot{width:8px;height:8px;border-radius:50%;background:#3fbf8a}
.headline{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin:21px 0 23px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:1.1px;color:#776be0;text-transform:uppercase;margin:0 0 7px}.headline h1{font-size:37px;letter-spacing:-1.3px;line-height:1.1;margin:0}.headline p:not(.eyebrow){color:var(--muted);font-size:13px;margin:9px 0 0}.small-edit{border:1px solid #e5e6ef;background:#fff;color:#6158bf;border-radius:13px;padding:12px;white-space:nowrap;font-size:12px;font-weight:800;min-height:44px}
.hero{background:linear-gradient(120deg,#262b65,#5749c9 78%,#7365eb);box-shadow:0 18px 38px #544bc326;color:#fff;padding:32px 34px;border-radius:26px;display:flex;flex-direction:column;align-items:flex-start;min-height:280px}.hero.negative{background:linear-gradient(120deg,#6b2744,#cb6988)}.hero p{font-size:12px;font-weight:850;letter-spacing:1.6px;color:#e0dafd;margin:0}.hero>strong{font-size:58px;line-height:1.3;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin:11px 0 0;white-space:nowrap}.hero>small{color:#e2dffd;font-size:13px}.add-button{background:#fff;color:#5044b2;border:0;border-radius:16px;min-height:64px;min-width:275px;font-size:16px;font-weight:850;margin:29px 0 0;padding:15px 30px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:18px 0 20px}.stat{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);padding:22px 21px;border-radius:20px;min-height:137px}.stat-label{font-weight:750;color:#818ca2;font-size:12px}.stat strong{font-size:26px;letter-spacing:-.9px;margin:15px 0 6px;display:block;font-variant-numeric:tabular-nums;white-space:nowrap}.stat small{display:block;font-size:11px;color:#9ca4b4;line-height:1.4}.stat.saving strong{color:#4e51bb}
.panel{background:white;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:22px;padding:25px;margin-bottom:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px}.section-head h2{font-size:21px;letter-spacing:-.5px;line-height:1.2;margin:0}.section-head p{color:#9aa3b2;font-size:12px;margin:5px 0 0}.chart-area{display:grid;grid-template-columns:260px 1fr;gap:31px;align-items:center;margin:18px 0 1px}.donut{width:235px;height:235px;border-radius:50%;display:grid;place-items:center;margin:7px auto}.donut-middle{width:74%;height:74%;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center}.donut-middle small{font-size:12px;color:#8e96a8}.donut-middle strong{font-size:25px;line-height:1.2;letter-spacing:-.7px;margin-top:7px;font-variant-numeric:tabular-nums;white-space:nowrap}.legend-row{display:flex;gap:10px;align-items:center;border-bottom:1px solid #f1f3f7;min-height:48px}.legend-row:last-child{border:0}.legend-row span{font-size:13px;color:#6c7588;flex:1}.legend-row strong{white-space:nowrap;font-size:14px}.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}.dot.purple{background:#776bf4}.dot.orange{background:#ffb477}.dot.pink{background:#f29ba1}.dot.mint{background:#e6f3ee;border:1px solid #cae8d9}
.habit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:20px}.habit{border:1px solid #ebebf5;background:#fafaff;border-radius:17px;min-height:148px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;padding:20px;position:relative}.habit .emoji{font-size:26px;margin-bottom:3px}.habit strong{font-size:16px}.habit>span:not(.emoji){font-size:15px;font-weight:850;color:#574bc3}.habit small{font-size:11px;color:#9aa2b2}.habit b{position:absolute;top:18px;right:19px;color:#aca6dc;font-size:18px}
.minor-button{background:#f0eeff;color:#6255cb;border:0;border-radius:12px;min-height:38px;padding:9px 12px;font-size:12px;font-weight:800}.bill-list{margin-top:15px}.bill{display:flex;align-items:center;text-align:left;width:100%;gap:12px;min-height:66px;border:0;border-bottom:1px solid #f0f1f5;background:#fff;padding:12px 2px;color:var(--text)}.bill:last-child{border-bottom:0}.bill span{display:flex;flex-direction:column;flex:1;min-width:0}.bill span strong{font-size:14px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bill span small{font-size:11px;color:#a0a8b6;margin-top:3px}.bill>strong{font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}.bill>strong small{color:#9ea8b6;font-size:10px;font-weight:400;margin-left:3px}.bill>i{font-style:normal;color:#a5a0cd;margin-left:8px}.muted-empty{color:#a0a7b5;font-size:12px;padding:18px 0}
.footnote{font-size:11px;line-height:1.7;color:#8b96a7;padding:2px 4px}.settings-line{display:flex;gap:11px;margin:17px 0 30px}.settings-line button{flex:1;border:1px solid #e7eaf2;color:#665cc5;background:#fff;padding:15px 12px;border-radius:14px;font-size:12px;font-weight:750}footer{text-align:center;padding:0 0 22px;font-size:11px;color:#a0a8b7}.loading{min-height:60vh;display:grid;place-items:center;color:#929bab}.empty-banner{background:#f0efff;border:1px solid #dedbf9;border-radius:17px;padding:20px;margin-bottom:18px}.empty-banner strong{font-size:16px}.empty-banner p{color:#8881ba;font-size:12px}.empty-banner button{border:0;border-radius:12px;background:#6155cd;color:white;padding:13px 17px;font-weight:850}
dialog{width:min(480px,calc(100vw - 28px));border:0;border-radius:25px;box-shadow:0 25px 110px #1b224c4e;padding:25px;max-height:min(88vh,800px);overflow:auto;color:var(--text)}dialog::backdrop{background:#1c214ab5;backdrop-filter:blur(3px)}.modal-header{display:flex;align-items:center;justify-content:space-between;margin:0 0 22px}.modal-header h2{font-size:22px;letter-spacing:-.6px;margin:0}.close{font-size:29px;color:#9198a7;background:#f4f5f9;min-width:42px;min-height:42px;border:0;border-radius:50%}.field{display:flex;flex-direction:column;gap:9px;margin:15px 0;color:#515d76;font-size:13px;font-weight:750}.field input,.field select{background:#f7f8fd;border:1px solid #e5e8f0;border-radius:13px;width:100%;min-height:54px;padding:13px;font-size:16px;color:#242945}.field input:focus,.field select:focus{outline:2px solid #a49bfa}.submit{width:100%;background:#6558de;color:#fff;border:0;border-radius:13px;min-height:57px;font-weight:850;font-size:16px;margin-top:16px}.remove{margin:14px 0 1px;color:#bc516c;border:0;background:#fff;font-weight:750}.modal-help{font-size:13px;color:#808b9c;line-height:1.5}.visible{opacity:1!important;transform:translateX(-50%) translateY(0)!important}#notice{position:fixed;z-index:999;left:50%;bottom:22px;transform:translateX(-50%) translateY(22px);opacity:0;transition:.2s;max-width:calc(100vw - 25px);width:max-content;text-align:center;box-shadow:0 15px 40px #1f24476b;color:#fff;background:#262b55;border-radius:15px;font-size:12px;font-weight:750;padding:15px 20px}
@media(max-width:700px){.app-wrapper{padding:0 16px}.topbar{height:67px}.brand{font-size:22px}.privacy-label{font-size:10px}.headline{margin:18px 0}.headline h1{font-size:31px}.headline p:not(.eyebrow){font-size:12px}.small-edit{font-size:11px;padding:11px 10px}.hero{padding:26px 24px;border-radius:22px;min-height:261px}.hero>strong{font-size:48px}.add-button{min-width:100%;min-height:63px;margin-top:29px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{min-height:129px;padding:17px 15px}.stat strong{font-size:21px}.stat.saving{grid-column:span 2;min-height:104px}.stat.saving strong{font-size:25px;margin-top:8px}.panel{padding:20px 18px;border-radius:20px}.section-head h2{font-size:19px}.chart-area{grid-template-columns:1fr;gap:9px}.donut{width:212px;height:212px}.donut-middle strong{font-size:23px}.legend{margin:3px 0 0}.legend-row{min-height:41px}.habit-grid{gap:9px}.habit{padding:15px 13px;min-height:150px}.habit strong{font-size:14px}.habit>span:not(.emoji){font-size:14px}.habit small{font-size:10px}.habit b{right:12px;top:13px}.bill>strong{font-size:14px}.bill span strong{font-size:13px}.bill>i{margin-left:1px}footer{padding-bottom:21px}}
@media(max-width:375px){.hero>strong{font-size:41px}.stat strong{font-size:19px}.privacy-label{font-size:9px}.habit>span:not(.emoji){font-size:12px}.headline h1{font-size:28px}}

  </style>


<style>
.replace-banner{border:2px solid #6860ea;border-radius:22px;background:#f1efff;padding:24px;margin-bottom:24px;color:#242648;text-align:center;box-shadow:0 7px 25px #7164df20}
.replace-banner>span{display:inline-block;font-size:12px;color:#544acb;font-weight:850;text-transform:uppercase;letter-spacing:.8px}
.replace-banner h2{font-size:23px;letter-spacing:-.6px;margin:9px 0}
.replace-banner p{max-width:500px;margin:8px auto 16px;font-size:13px;line-height:1.6;color:#5e6085}
.replace-action{display:block;width:100%;min-height:59px;border:0;border-radius:14px;background:#625ae8;color:#fff;font-size:16px;font-weight:800;padding:14px 18px}
.keep-action{border:0;background:transparent;color:#655dac;padding:13px 20px;font-weight:700}
</style>
</head>
<body>
  <div class="app-wrapper">
    <header class="topbar"><div class="brand"><span class="brand-icon">↗</span>lucide<span class="brand-dot">.</span></div><span class="privacy-label"><span class="privacy-dot"></span>Sur cet appareil</span></header>
    <main id="app" aria-live="polite"><div class="loading">Chargement de ton budget…</div></main>
    <footer>Lucide Budget · Budget estimatif, pas le solde bancaire réel.</footer>
  </div>
  <dialog id="editor" aria-label="Modifier mon budget"><div id="editorContent"></div></dialog>
  <div id="notice" role="status" aria-live="polite"></div>
<script src="./simple.js" defer></script>
</body>
</html>
